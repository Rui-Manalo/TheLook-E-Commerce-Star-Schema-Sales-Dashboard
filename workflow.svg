<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Project workflow</title>
<desc>Horizontal flowchart showing the process from exploring the raw BigQuery dataset through modeling, validation, and the Power BI dashboard, with icons marking which tool each step used.</desc>

<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<symbol id="icon-db" viewBox="0 0 24 24">
<ellipse cx="12" cy="5" rx="9" ry="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
<path d="M3 5v14c0 1.657 4.03 3 9 3s9-1.343 9-3V5" fill="none" stroke="currentColor" stroke-width="1.6"/>
<path d="M3 12c0 1.657 4.03 3 9 3s9-1.343 9-3" fill="none" stroke="currentColor" stroke-width="1.6"/>
</symbol>
<symbol id="icon-chart" viewBox="0 0 24 24">
<rect x="3" y="13" width="4.5" height="8" rx="1" fill="currentColor"/>
<rect x="10" y="7" width="4.5" height="14" rx="1" fill="currentColor"/>
<rect x="17" y="3" width="4.5" height="18" rx="1" fill="currentColor"/>
</symbol>
</defs>

<g>
<rect x="20" y="50" width="150" height="90" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<rect x="20" y="50" width="5" height="90" fill="#0F6E56"/>
<use href="#icon-db" x="32" y="62" width="20" height="20" style="color:#0F6E56"/>
<text x="32" y="112" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#04342C">Explore raw data</text>
<text x="32" y="130" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56">BigQuery</text>
</g>

<line x1="170" y1="95" x2="183" y2="95" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow-teal)"/>

<g>
<rect x="183" y="50" width="150" height="90" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<rect x="183" y="50" width="5" height="90" fill="#0F6E56"/>
<use href="#icon-db" x="195" y="62" width="20" height="20" style="color:#0F6E56"/>
<text x="195" y="112" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#04342C">Model &amp; clean</text>
<text x="195" y="130" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56">BigQuery</text>
</g>

<line x1="333" y1="95" x2="346" y2="95" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow-teal)"/>

<g>
<rect x="346" y="50" width="150" height="90" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<rect x="346" y="50" width="5" height="90" fill="#0F6E56"/>
<use href="#icon-db" x="358" y="62" width="20" height="20" style="color:#0F6E56"/>
<text x="358" y="112" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#04342C">Build tables</text>
<text x="358" y="130" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56">BigQuery</text>
</g>

<line x1="496" y1="95" x2="509" y2="95" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow-teal)"/>

<g>
<rect x="509" y="50" width="150" height="90" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<rect x="509" y="50" width="5" height="90" fill="#0F6E56"/>
<use href="#icon-db" x="521" y="62" width="20" height="20" style="color:#0F6E56"/>
<text x="521" y="112" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#04342C">Validate &amp; test</text>
<text x="521" y="130" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56">BigQuery</text>
</g>

<path d="M584 140 L584 185 L490 185 L490 230" fill="none" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow-teal)"/>

<g>
<rect x="380" y="230" width="220" height="90" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<rect x="380" y="230" width="5" height="90" fill="#0F6E56"/>
<use href="#icon-db" x="392" y="242" width="20" height="20" style="color:#0F6E56"/>
<text x="392" y="292" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#04342C">Create reporting view</text>
<text x="392" y="310" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56">BigQuery</text>
</g>

<line x1="380" y1="275" x2="320" y2="275" stroke="#185FA5" stroke-width="0.5" marker-end="url(#arrow-blue)"/>

<g>
<rect x="100" y="230" width="220" height="90" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
<rect x="100" y="230" width="5" height="90" fill="#185FA5"/>
<use href="#icon-chart" x="112" y="242" width="20" height="20" style="color:#185FA5"/>
<text x="112" y="292" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#042C53">Sales dashboard</text>
<text x="112" y="310" font-family="Arial, sans-serif" font-size="11" fill="#185FA5">Power BI</text>
